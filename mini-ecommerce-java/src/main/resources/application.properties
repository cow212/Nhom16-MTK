# Cấu hình cơ sở dữ liệu H2 (có thể đổi sang MySQL/PostgreSQL/SQL Server khi cần)
spring.datasource.url=jdbc:h2:mem:miniecommerce;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (truy cập http://localhost:8080/h2-console)
spring.h2.console.enabled=true

server.port=8080

# Swagger / OpenAPI 3 configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=true
springdoc.packages-to-scan=com.miniecommerce.web
springdoc.api-docs.version=openapi_3_0
